name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - run: flutter pub get
      
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      
      - name: Disable codesigning for CI
        run: |
          cd ios
          # Удаляем все упоминания DEVELOPMENT_TEAM
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = ""/g' Runner.xcodeproj/project.pbxproj
          # Отключаем автоматическую подпись
          sed -i '' 's/ProvisioningStyle = .*/ProvisioningStyle = Manual/g' Runner.xcodeproj/project.pbxproj
      
      - name: Build IPA (unsigned)
        run: |
          cd ios
          flutter build ios --release --no-codesign
      
      - name: Create Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
      
      - name: Zip IPA
        run: |
          zip -r F1-Acker.ipa Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: F1-Acker
          path: F1-Acker.ipa