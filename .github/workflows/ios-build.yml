name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get
      - run: pod repo update
        working-directory: ios
      - name: Set up provisioning
        run: |
          cd ios
          # Создаём пустой файл для автоматической подписи
          echo "PROVISIONING_PROFILE_SPECIFIER = ''" >> Runner/Config.xcconfig
          echo "DEVELOPMENT_TEAM = ''" >> Runner/Config.xcconfig
      - run: flutter build ios --release --no-codesign
        working-directory: ios
      - run: mkdir Payload
        working-directory: build/ios/iphoneos
      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos
      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport
          path: build/ios/iphoneos/FlutterIpaExport.ipa